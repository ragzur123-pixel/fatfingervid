    .chart-red-flash { position: absolute; inset: 0; background: rgba(255,51,102,0.25); opacity: 0; z-index: 100; pointer-events: none; mix-blend-mode: screen; }
  </style>

  <script>
    // GENERATE MASSIVE HISTORICAL GRAPH DATA
    const historyPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    historyPath.setAttribute("class", "stock-line");
    historyPath.setAttribute("id", "stockLineHistory");
    historyPath.style.opacity = "0"; // Kept hidden until 11s zoom out

    let pathD = "M -400 600 ";
    let currentY = 600;
    for(let x = -400; x < 0; x += 10) {
      let trend = (160 - currentY) * 0.02;
      if (x > -350 && x < -100) trend -= 15; // aggressive jagged climb
      if (x > -100) trend = (160 - currentY) * 0.15; // pull to 160 at the end
      currentY += trend + (Math.sin(x * 0.73) * Math.cos(x * 0.29)) * 120; // deterministic volatility
      pathD += `L ${x} ${currentY.toFixed(1)} `;
    }
    pathD += "L 0 160"; // Connect perfectly to the start of the noise line
    historyPath.setAttribute("d", pathD);
    document.querySelector(".chart-svg").prepend(historyPath);

    window.__timelines = window.__timelines || {};
    gsap.set("#stockLineHistory", { x: -19, y: 19 });
    const tl = gsap.timeline({ paused: true });

    tl.set(".chart-container", { y: 0, x: 0, data: "hf-hold" }, 0);

    // Set initial stationary state (same as end of previous timeline)
    gsap.set(".mac-3d-ground-layer", { opacity: 1 });
    gsap.set("#mac3DStage", { scale: 0.68, rotateX: 9, rotateY: 0, y: -35, opacity: 1 });
    gsap.set(".vhs-timestamp", { x: 0, y: 0, scale: 1, innerText: "REC ● DEC 08 2005 - 09:27:04 JST" });
    gsap.set("#mouseCursor", { x: 490, y: 520, opacity: 1 });

    // CRT TV TURN OFF EFFECT (0.5s - 1.0s)
    tl.to("#minimalStage, #mouseCursor", { scaleY: 0.005, filter: "brightness(3)", duration: 0.15, ease: "power4.in" }, 0.5);
    tl.to("#minimalStage, #mouseCursor", { scaleX: 0, opacity: 0, duration: 0.2, ease: "power4.in" }, 0.65);

    // FADE IN CHART SCENE (1.5s)
    tl.to("#chartStage", { opacity: 1, duration: 0.8, ease: "power2.out" }, 1.5);

    // ZOOM INTO MONITOR / CENTER THE TIP (1.5s - 4.5s)
    tl.to("#mac3DStage", { scale: 2.5, rotateX: 0, x: -240, y: 550, duration: 3.0, ease: "power2.inOut" }, 1.5);
    tl.to(".mac-3d-ground-layer, .crt-glass-glare, .crt-scanlines, .vhs-timestamp", { opacity: 0, duration: 1.5, ease: "power2.in" }, 1.5);

    // CROSSFADE 3D HEADER INTO 2D WATERMARK AND DISSOLVE MONITOR INTO VOID (1.5s - 4.5s)
    tl.to(".chart-header", { opacity: 0, duration: 3.0, ease: "power2.inOut" }, 1.5);

    tl.to("#fixedHudHeader", { opacity: 1, duration: 3.0, ease: "power2.inOut" }, 1.5);
    tl.to("#digitalVoidBg", { opacity: 1, duration: 3.0, ease: "power2.inOut" }, 1.5);

    // DRAW JAGGED CHART LINE (1.5s - 4.5s)
    tl.to("#stockLineNoise", { strokeDashoffset: 0, duration: 3.0, ease: "none" }, 1.5);

    // THE CRASH (4.5s)
    tl.to("#stockLineHistory, #stockLineNoise, #stockLineCrash", { stroke: "#ff3366", filter: "drop-shadow(0 0 16px rgba(255,51,102,0.95))", duration: 0.1 }, 4.5);
    tl.to("#stockLineCrash", { strokeDashoffset: 0, duration: 0.9, ease: "power4.in" }, 4.5);

    // EXTREME VERTICAL MOTION BLUR
    tl.to("#blurVal", { attr: { stdDeviation: "0 30" }, duration: 0.7, ease: "power4.in" }, 4.5);
    tl.to("#blurVal", { attr: { stdDeviation: "0 0" }, duration: 0.4, ease: "power2.out" }, 5.2);

    // VIOLENT CAMERA SHAKE
    tl.to("#chartStage", { x: "+=20", duration: 0.05, yoyo: true, repeat: 17, ease: "sine.inOut" }, 4.5);

    tl.to(".chart-grid", { backgroundPositionY: "-=4000px", duration: 0.9, ease: "power4.in" }, 4.5);

    // CONTINUOUS FREEFALL (5.4s - 15.0s)
    tl.to(".chart-grid", { backgroundPositionY: "-=8000px", duration: 9.6, ease: "none" }, 5.4);

    // LOSS COUNTER TRACKS THE DROPPING LINE (4.5s - 5.4s)
    tl.to(".loss-counter-wrapper", { opacity: 1, duration: 0.1 }, 4.5);
    tl.to(".loss-counter-wrapper", { x: 30, y: 710, duration: 0.9, ease: "power4.in" }, 4.5);

    // SCREEN FLASHES RED (4.5s)
    tl.to("#chartFlash", { opacity: 1, duration: 0.1 }, 4.5);
    tl.to("#chartFlash", { opacity: 0, duration: 0.8, ease: "power2.out" }, 4.6);

    const lossObj = { val: 0 };
    tl.to(lossObj, {
      val: 40700000000,
      duration: 6.5,
      ease: "power2.inOut",
      onUpdate: function() {
        document.getElementById("lossValue").innerText = "-¥" + Math.floor(lossObj.val).toLocaleString("en-US");
      }
    }, 4.5);

    // MASSIVE ZOOM OUT TO REVEAL HISTORY (11s - 14s)
    tl.to("#stockLineHistory", { opacity: 1, duration: 2.0, ease: "power2.inOut" }, 11.0);
    tl.to(".chart-grid", { opacity: 0, duration: 2.0, ease: "power2.inOut" }, 11.0);
    tl.to("#chartStage", { scale: 0.45, x: 80, y: 140, duration: 3.0, ease: "power3.inOut" }, 11.0);

    tl.to({}, { duration: 3.0 }, 14.0); // Pads out to 17s total
